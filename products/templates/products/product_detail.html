<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        header { background: #1d4ed8; color: white; padding: 20px; text-align: center; }
        header a { background: #6b7280; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        main { padding: 20px; display: flex; justify-content: center; }
        .details { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .details img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; }
        .details h2 { margin-bottom: 10px; }
        .details p { margin: 5px 0; color: #333; }
    </style>
</head>
<body>
    <header>
        <h1>{{ product.name }}</h1>
        <a href="{% url 'all_products' %}">Back to All Products</a>
    </header>
    <main>
        <div class="details">
            <h2>Details</h2>
            <p>Price: Ksh. {{ product.price }}</p>
            <p>Category: {{ product.category }}</p>
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            {% else %}
                <p>No image available</p>
            {% endif %}
            <p>{{ product.description }}</p>
        </div>
    </main>
</body>
</html>
