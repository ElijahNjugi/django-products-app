<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        header { background: #1d4ed8; color: white; padding: 20px; text-align: center; }
        header a { background: #6b7280; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        main { padding: 20px; display: flex; justify-content: center; }
        form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        form button { background: #16a34a; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        form button:hover { background: #15803d; }
    </style>
</head>
<body>
    <header>
        <h1>Add Product</h1>
        <a href="{% url 'all_products' %}">Back to All Products</a>
    </header>
    <main>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Product</button>
        </form>
    </main>
</body>
</html>
